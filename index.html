<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>車險題庫 練習系統</title>
<style>
  :root{
    --bg:#f4f1ea;
    --card:#ffffff;
    --ink:#2b2620;
    --muted:#847c6d;
    --accent:#2f6690;
    --accent-dark:#204a68;
    --line:#e4ddce;
    --correct:#3f7d52;
    --correct-bg:#e8f3ea;
    --wrong:#b3462c;
    --wrong-bg:#fbebe6;
    --chip:#e4edf3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",-apple-system,BlinkMacSystemFont,sans-serif;
    background:
      radial-gradient(circle at 10% 10%, rgba(47,102,144,0.06), transparent 40%),
      radial-gradient(circle at 90% 90%, rgba(47,102,144,0.06), transparent 40%),
      var(--bg);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:32px 16px 60px;
  }
  .wrap{
    width:100%;
    max-width:760px;
  }
  header{
    text-align:center;
    margin-bottom:24px;
  }
  header h1{
    font-size:1.5rem;
    margin:0 0 4px;
    letter-spacing:1px;
  }
  header p{
    margin:0;
    color:var(--muted);
    font-size:0.9rem;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:28px;
    box-shadow:0 10px 30px rgba(30,40,60,0.06);
  }
  .stat-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
    font-size:0.85rem;
    color:var(--muted);
    flex-wrap:wrap;
    gap:8px;
  }
  .stat-bar .badge{
    background:var(--chip);
    color:var(--accent-dark);
    padding:4px 12px;
    border-radius:999px;
    font-weight:600;
  }
  .progress-track{
    height:6px;
    border-radius:999px;
    background:var(--line);
    overflow:hidden;
    margin-bottom:20px;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    transition:width .3s ease;
  }
  h2.qtitle{
    font-size:1.1rem;
    line-height:1.7;
    white-space:pre-wrap;
    margin:0 0 20px;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:18px;
  }
  .opt{
    text-align:left;
    padding:14px 16px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:#fdfcf9;
    cursor:pointer;
    font-size:0.98rem;
    color:var(--ink);
    transition:border-color .15s, background .15s, transform .1s;
    display:flex;
    gap:10px;
    align-items:flex-start;
  }
  .opt:hover:not(:disabled){
    border-color:var(--accent);
    background:#f3f8fb;
  }
  .opt:active:not(:disabled){transform:scale(0.99);}
  .opt .num{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--chip);
    color:var(--accent-dark);
    font-size:0.8rem;
    display:flex;align-items:center;justify-content:center;
    font-weight:700;
  }
  .opt:disabled{cursor:default;}
  .opt.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
  }
  .opt.correct .num{background:var(--correct);color:#fff;}
  .opt.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
  }
  .opt.wrong .num{background:var(--wrong);color:#fff;}
  .opt.dim{opacity:0.55;}

  .feedback{
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:18px;
    font-size:0.95rem;
    line-height:1.6;
  }
  .feedback.correct{background:var(--correct-bg);color:var(--correct);}
  .feedback.wrong{background:var(--wrong-bg);color:var(--wrong);}
  .feedback .verdict{font-weight:700;font-size:1.05rem;display:block;margin-bottom:4px;}
  .feedback .exp{color:var(--ink);opacity:0.8;font-size:0.88rem;margin-top:8px;white-space:pre-wrap;}

  .actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  button.btn{
    flex:1 1 auto;
    padding:13px 18px;
    border-radius:12px;
    border:none;
    font-size:0.95rem;
    font-weight:600;
    cursor:pointer;
    transition:filter .15s, transform .1s;
  }
  button.btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-secondary{background:var(--chip);color:var(--accent-dark);}
  .btn-secondary:hover{filter:brightness(0.97);}
  .btn-ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent-dark);}
  button.btn:disabled{opacity:0.4;cursor:not-allowed;}

  .mode-tabs{
    display:flex;
    gap:8px;
    margin-bottom:22px;
    background:var(--chip);
    padding:4px;
    border-radius:12px;
  }
  .mode-tabs button{
    flex:1;
    padding:10px 12px;
    border:none;
    border-radius:9px;
    background:transparent;
    color:var(--accent-dark);
    font-size:0.9rem;
    font-weight:600;
    cursor:pointer;
  }
  .mode-tabs button.active{
    background:#fff;
    box-shadow:0 2px 6px rgba(30,40,60,0.08);
  }

  .setup-field{margin-bottom:18px;}
  .setup-field label{display:block;font-size:0.9rem;color:var(--muted);margin-bottom:8px;}
  .setup-field input[type=number]{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:1.5px solid var(--line);
    font-size:1rem;
    font-family:inherit;
  }
  .setup-hint{font-size:0.8rem;color:var(--muted);margin-top:6px;}
  .quick-picks{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .quick-picks button{
    padding:6px 12px;
    border-radius:999px;
    border:1px solid var(--line);
    background:#fff;
    font-size:0.8rem;
    cursor:pointer;
    color:var(--accent-dark);
  }
  .quick-picks button:hover{border-color:var(--accent);}

  .topic-list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .topic-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 16px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:#fdfcf9;
    cursor:pointer;
    text-align:left;
  }
  .topic-item:hover{border-color:var(--accent);background:#f3f8fb;}
  .topic-item .tname{font-size:0.95rem;font-weight:600;}
  .topic-item .tcount{font-size:0.78rem;color:var(--muted);margin-top:2px;}
  .topic-item .tarrow{color:var(--accent);font-size:1.1rem;}

  .summary-row{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    font-size:0.92rem;
  }
  .summary-row:last-child{border-bottom:none;}
  .mode-banner{
    font-size:0.8rem;
    background:#e4edf3;
    color:var(--accent-dark);
    padding:6px 12px;
    border-radius:999px;
    display:inline-block;
    margin-bottom:14px;
    font-weight:600;
  }
  footer{
    text-align:center;
    color:var(--muted);
    font-size:0.78rem;
    margin-top:24px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>車險題庫 · 練習系統</h1>
    <p>共 <span id="totalCount">0</span> 題，可依題號或主題開始作答</p>
  </header>

  <div class="card" id="app"></div>
  <footer>作答紀錄僅保存在本次瀏覽階段，重新整理頁面將會重置。</footer>
</div>

        <div class="quick-picks">
          <button data-n="1">從第 1 題</button>
          <button data-n="${Math.ceil(QUESTIONS.length*0.25)}">第 25%</button>
          <button data-n="${Math.ceil(QUESTIONS.length*0.5)}">第 50%</button>
          <button data-n="${Math.ceil(QUESTIONS.length*0.75)}">第 75%</button>
        </div>
      </div>
      <button class="btn btn-primary" id="startBtn" style="width:100%">開始作答</button>
    `;
  } else {
    const items = TOPIC_ORDER.map((t, idx) => `
      <button class="topic-item" data-topic="${idx}">
        <div>
          <div class="tname">${idx+1}. ${escapeHtml(t)}</div>
          <div class="tcount">共 ${TOPIC_COUNT[t]} 題</div>
        </div>
        <div class="tarrow">›</div>
      </button>
    `).join('');
    bodyHtml = `<div class="topic-list">${items}</div>`;
  }

  app.innerHTML = tabsHtml + bodyHtml;

  document.getElementById('tabNumber').addEventListener('click', ()=>{
    state.setupTab = 'number';
    render();
  });
  document.getElementById('tabTopic').addEventListener('click', ()=>{
    state.setupTab = 'topic';
    render();
  });

  if(state.setupTab === 'number'){
    const input = document.getElementById('startNum');
    app.querySelectorAll('.quick-picks button').forEach(b=>{
      b.addEventListener('click', ()=>{ input.value = b.dataset.n; });
    });
    document.getElementById('startBtn').addEventListener('click', ()=>{
      let n = parseInt(input.value, 10);
      if(isNaN(n) || n < 1) n = 1;
      if(n > QUESTIONS.length) n = QUESTIONS.length;
      state.startNum = n;
      state.order = QUESTIONS.slice(n-1).map(q=>q.id);
      state.roundLabel = `第 ${n} 題起`;
      beginRound();
    });
  } else {
    app.querySelectorAll('.topic-item').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = parseInt(btn.dataset.topic, 10);
        const topicName = TOPIC_ORDER[idx];
        state.order = QUESTIONS.filter(q => q.topic === topicName).map(q => q.id);
        state.roundLabel = topicName;
        beginRound();
      });
    });
  }
}

function beginRound(){
  state.pos = 0;
  state.wrongSet = new Set();
  state.inReview = false;
  state.selectedOpt = null;
  state.screen = 'question';
  render();
}

function currentQueueAndPos(){
  if(state.inReview){
    return { queue: state.reviewQueue, pos: state.reviewPos };
  }
  return { queue: state.order, pos: state.pos };
}

function currentQuestion(){
  const {queue, pos} = currentQueueAndPos();
  if(pos >= queue.length) return null;
  return byId[queue[pos]];
}

function renderQuestion(showFeedback){
  const q = currentQuestion();
  if(!q){ state.screen = 'roundDone'; return render(); }

  const {queue, pos} = currentQueueAndPos();
  const totalInQueue = queue.length;
  const progressPct = Math.round(((pos) / totalInQueue) * 100);

  let bannerHtml = `<div class="mode-banner">${state.inReview ? '複習模式 · ' : ''}${escapeHtml(state.roundLabel)}</div>`;

  let optsHtml = q.opts.map((opt, idx)=>{
    const optNum = idx+1;
    let cls = 'opt';
    let disabledAttr = '';
    if(showFeedback){
      disabledAttr = 'disabled';
      if(optNum === q.ans){
        cls += ' correct';
      } else if(optNum === state.selectedOpt){
        cls += ' wrong';
      } else {
        cls += ' dim';
      }
    }
    return `<button class="${cls}" data-opt="${optNum}" ${disabledAttr}>
        <span class="num">${optNum}</span><span>${escapeHtml(opt)}</span>
      </button>`;
  }).join('');

  let feedbackHtml = '';
  if(showFeedback){
    const wasCorrect = state.selectedOpt === q.ans;
    feedbackHtml = `<div class="feedback ${wasCorrect ? 'correct':'wrong'}">
        <span class="verdict">${wasCorrect ? '✓ 答對了！' : '✗ 答錯了，正確答案是 (' + q.ans + ') ' + escapeHtml(q.opts[q.ans-1])}</span>
        ${q.exp ? `<div class="exp">解析：${escapeHtml(q.exp)}</div>` : ''}
      </div>`;
  }

  let actionsHtml = '';
  if(showFeedback){
    const isLastInQueue = (pos+1) >= totalInQueue;
    const wrongCount = state.wrongSet.size;
    actionsHtml = `<div class="actions">
      <button class="btn btn-primary" id="nextBtn">${isLastInQueue ? '完成本回合' : '下一題 →'}</button>
      <button class="btn btn-secondary" id="reviewBtn" ${wrongCount===0 ? 'disabled':''}>複習本回合錯題（${wrongCount}）</button>
    </div>`;
  }

  app.innerHTML = `
    ${bannerHtml}
    <div class="stat-bar">
      <span>題號 <strong>${q.id}</strong>（${escapeHtml(q.topic)}）</span>
      <span class="badge">${state.inReview ? '複習進度' : '進度'} ${pos+1} / ${totalInQueue}</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%"></div></div>
    <h2 class="qtitle">${escapeHtml(q.q)}</h2>
    <div class="options">${optsHtml}</div>
    ${feedbackHtml}
    ${actionsHtml}
  `;

  if(!showFeedback){
    app.querySelectorAll('.opt').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const chosen = parseInt(btn.dataset.opt, 10);
        state.selectedOpt = chosen;
        if(chosen !== q.ans){
          state.wrongSet.add(q.id);
        } else {
          if(state.inReview) state.wrongSet.delete(q.id);
        }
        state.screen = 'feedback';
        render();
      });
    });
  } else {
    const nextBtn = document.getElementById('nextBtn');
    if(nextBtn){
      nextBtn.addEventListener('click', ()=>{
        advance();
      });
    }
    const reviewBtn = document.getElementById('reviewBtn');
    if(reviewBtn){
      reviewBtn.addEventListener('click', ()=>{
        startReview();
      });
    }
  }
}

function advance(){
  if(state.inReview){
    state.reviewPos += 1;
    if(state.reviewPos >= state.reviewQueue.length){
      state.inReview = false;
      if(state.pos >= state.order.length){
        state.screen = 'roundDone';
      } else {
        state.screen = 'question';
      }
    } else {
      state.screen = 'question';
    }
  } else {
    state.pos += 1;
    if(state.pos >= state.order.length){
      state.screen = 'roundDone';
    } else {
      state.screen = 'question';
    }
  }
  state.selectedOpt = null;
  render();
}

function startReview(){
  if(state.wrongSet.size === 0) return;
  state.reviewQueue = Array.from(state.wrongSet);
  state.reviewPos = 0;
  state.inReview = true;
  state.selectedOpt = null;
  state.screen = 'question';
  render();
}

function renderRoundDone(){
  const wrongCount = state.wrongSet.size;
  const totalAnswered = state.order.length;
  app.innerHTML = `
    <div style="text-align:center;margin-bottom:20px;">
      <div style="font-size:2rem;margin-bottom:8px;">🎉</div>
      <h2 class="qtitle" style="text-align:center;">本回合作答完成！</h2>
      <div class="mode-banner">${escapeHtml(state.roundLabel)}</div>
    </div>
    <div class="summary-row"><span>作答題數（主回合）</span><strong>${totalAnswered}</strong></div>
    <div class="summary-row"><span>尚未答對的題目</span><strong style="color:${wrongCount>0?'var(--wrong)':'var(--correct)'}">${wrongCount}</strong></div>
    <div class="actions" style="margin-top:20px;">
      ${wrongCount>0 ? `<button class="btn btn-primary" id="reviewBtn2">複習錯題（${wrongCount}）</button>` : ''}
      <button class="btn ${wrongCount>0?'btn-secondary':'btn-primary'}" id="restartBtn">重新選擇題號/主題</button>
    </div>
  `;
  const reviewBtn2 = document.getElementById('reviewBtn2');
  if(reviewBtn2){
    reviewBtn2.addEventListener('click', startReview);
  }
  document.getElementById('restartBtn').addEventListener('click', ()=>{
    state = {
      screen:'setup', setupTab: state.setupTab, order:[], pos:0, wrongSet:new Set(),
      selectedOpt:null, reviewQueue:[], reviewPos:0,
      inReview:false, startNum: state.startNum, roundLabel: ''
    };
    render();
  });
}

function escapeHtml(str){
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
